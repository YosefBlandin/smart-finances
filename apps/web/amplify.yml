# Amplify web compute build for the monorepo (D-71, D-110). The settings below arrive as the branch's
# environment variables; no secret value is ever one of them (only the secret's ARN). The region is not one of them:
# the web server takes it from its runtime, else us-east-1 (D-159).
version: 1
applications:
  - appRoot: apps/web
    frontend:
      phases:
        preBuild:
          commands:
            - cd ../..
            - npm ci
            - npm run lint --if-present --workspace @smart-finances/web
            # The unit tests run as STAGE=test: without the build host's AWS runtime markers (the STAGE=test refusal, D-171)
            # and without the branch's settings, which would replace the test defaults.
            - env -u AWS_EXECUTION_ENV -u AWS_LAMBDA_FUNCTION_NAME -u STAGE -u API_URL -u USER_POOL_ID -u WEB_CLIENT_ID -u WEB_CLIENT_SECRET_ARN -u HMAC_SECRET_ARN -u SESSIONS_TABLE -u ACCOUNTS_TABLE -u UPLOAD_HOST -u WEB_ORIGIN -u SUPPORT_ADDRESS -u COMMIT_SHA npm test --workspace @smart-finances/web
            - cd apps/web
        build:
          commands:
            - env | grep -E '^(STAGE|API_URL|USER_POOL_ID|WEB_CLIENT_ID|WEB_CLIENT_SECRET_ARN|HMAC_SECRET_ARN|SESSIONS_TABLE|ACCOUNTS_TABLE|UPLOAD_HOST|WEB_ORIGIN|SUPPORT_ADDRESS)=' > .env.production || true
            - echo "COMMIT_SHA=$AWS_COMMIT_ID" >> .env.production
            - npm run build
      artifacts:
        baseDirectory: .next
        files:
          - '**/*'
      cache:
        paths:
          - ../../node_modules/**/*
          - .next/cache/**/*
